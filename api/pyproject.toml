[project]
name = "jyotish-api"
version = "0.1.0"
description = "HTTP API for the Jyotish platform."
requires-python = ">=3.11"
dependencies = [
    "jyotish-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pg8000>=1.31",
    "pyjwt[crypto]>=2.10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jyotish_api"]

[tool.uv.sources]
jyotish-engine = { workspace = true }
