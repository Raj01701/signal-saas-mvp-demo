# Generated by scripts/generate_rule_families.py; edit the script and re-run it.
defaults:
  category: malika
  school: parashari
  provenance: traditional
families:
- template:
    id: malika.{name}
    name: '{name|title} Malika Yoga'
    description: The seven planets occupy seven consecutive houses, one in each, starting from the {start|ord}
      house. The same charts also form the Nabhasa yoga of that arc (Nauka, Kuta, Chatra, Chapa or Ardha
      Chandra).
    when: houses_of(seven) == arc({start}, 7)
    participants: seven
    sources:
    - {text: raman_300, locator: Malika Yogas, verified: false}
  instances:
  - params:
      start: 1
      name: lagna
    overrides:
      effects:
        domains: [self, health]
        polarity: positive
        strength: moderate
        summary: A chain of planets starting in the 1st house emphasises its matters (body, health and
          standing) and gives an eventful, energetic life.
    tests:
      positive:
      - {lagna: aries, sun: aries, moon: taurus, mars: gemini, mercury: cancer, jupiter: leo, venus: virgo,
        saturn: libra, rest: aries}
      negative:
      - {lagna: aries, sun: aries, moon: taurus, mars: gemini, mercury: cancer, jupiter: leo, venus: virgo,
        saturn: scorpio, rest: aries}
  - params:
      start: 2
      name: dhana
    overrides:
      effects:
        domains: [wealth]
        polarity: positive
        strength: moderate
        summary: A chain of planets starting in the 2nd house emphasises its matters (wealth, family and
          speech) and gives an eventful, energetic life.
    tests:
      positive:
      - {lagna: aries, sun: taurus, moon: gemini, mars: cancer, mercury: leo, jupiter: virgo, venus: libra,
        saturn: scorpio, rest: aries}
      negative:
      - {lagna: aries, sun: taurus, moon: gemini, mars: cancer, mercury: leo, jupiter: virgo, venus: libra,
        saturn: sagittarius, rest: aries}
  - params:
