# Generated by scripts/generate_rule_families.py; edit the script and re-run it.
defaults:
  category: bhava
  school: parashari
  provenance: classical
families:
- template:
    id: bhava.{name}
    name: '{name|title} Yoga'
    description: The lord of the {house|ord} house occupies the 6th, 8th or 12th house from the lagna.
    when: house(lord({house})) in dusthanas
    participants: '[lord({house})]'
    notes: Phaladeepika names one yoga for each house lord in a dusthana; those of the 6th, 8th and 12th
      lords (Harsha, Sarala, Vimala) are the Viparita Raja yogas. Raman reads Harsha, Sarala and Vimala
      more narrowly (the lord in its own house).
    sources:
    - {text: phaladeepika, edition: sastri, chapter: 6, verified: false}
    - {text: raman_300, locator: '{name|title} Yoga', verified: false}
  instances:
  - params:
      house: 1
      name: avayoga
    overrides:
      category: bhava
      effects:
        domains: [self, health]
        polarity: negative
        strength: moderate
        summary: 'The 1st lord in a dusthana weakens the 1st house: setbacks in body, health and standing.'
    tests:
      positive:
      - {lagna: aries, mars: scorpio, rest: gemini}
      negative:
      - {lagna: aries, mars: aries, rest: gemini}
  - params:
      house: 2
      name: nisswa
    overrides:
      category: bhava
      effects:
        domains: [wealth]
        polarity: negative
        strength: moderate
        summary: 'The 2nd lord in a dusthana weakens the 2nd house: setbacks in wealth, family and speech.'
    tests:
      positive:
      - {lagna: aries, venus: scorpio, rest: gemini}
      negative:
      - {lagna: aries, venus: aries, rest: gemini}
  - params:
      house: 3
      name: mrityu
    overrides:
      category: bhava
      effects:
        domains: [siblings, character]
        polarity: negative
        strength: moderate
        summary: 'The 3rd lord in a dusthana weakens the 3rd house: setbacks in siblings, courage and
          initiative.'
    tests:
      positive:
      - {lagna: aries, mercury: scorpio, rest: gemini}
      negative:
      - {lagna: aries, mercury: aries, rest: gemini}
  - params:
      house: 4
      name: kuhu
    overrides:
      category: bhava
      effects:
        domains: [property, parents]
        polarity: negative
        strength: moderate
        summary: 'The 4th lord in a dusthana weakens the 4th house: setbacks in mother, home, property
          and comforts.'
    tests:
      positive:
      - {lagna: aries, moon: scorpio, rest: gemini}
      negative:
      - {lagna: aries, moon: aries, rest: gemini}
  - params:
      house: 5
      name: pamara
    overrides:
      category: bhava
      effects:
        domains: [children, intellect]
        polarity: negative
        strength: moderate
        summary: 'The 5th lord in a dusthana weakens the 5th house: setbacks in children, intelligence
          and merit.'
    tests:
      positive:
      - {lagna: aries, sun: scorpio, rest: gemini}
      negative:
      - {lagna: aries, sun: aries, rest: gemini}
  - params:
      house: 6
      name: harsha
    overrides:
      category: viparita
      effects:
        domains: [conflict, health]
        polarity: positive
        strength: moderate
        summary: 'The 6th lord in a dusthana is a Viparita Raja yoga: enemies and illness are overcome;
          health, happiness and success over rivals.'
    tests:
      positive:
      - {lagna: aries, mercury: scorpio, rest: gemini}
      negative:
      - {lagna: aries, mercury: aries, rest: gemini}
  - params:
      house: 7
      name: dushkriti
    overrides:
      category: bhava
      effects:
