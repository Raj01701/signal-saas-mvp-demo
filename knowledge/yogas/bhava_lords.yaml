        polarity: positive
        strength: moderate
        summary: 'The 8th lord in a dusthana is a Viparita Raja yoga: long life, fearlessness, learning
          and prosperity.'
    tests:
      positive:
      - {lagna: aries, mars: scorpio, rest: gemini}
      negative:
      - {lagna: aries, mars: aries, rest: gemini}
  - params:
