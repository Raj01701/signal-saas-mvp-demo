# Generated by scripts/generate_rule_families.py; edit the script and re-run it.
defaults:
  category: neecha_bhanga
  school: parashari
  provenance: classical
families:
- template:
    id: neecha_bhanga.{planet}
    name: Neecha Bhanga Raja Yoga ({planet|title})
    description: '{planet|title} is debilitated, but the debility is cancelled: the lord of its sign,
      the lord of its exaltation sign, or a planet exalted in that sign is in a kendra from the lagna
      or the Moon (the Moon itself counts from the lagna only); or the lord of its sign aspects it; or
      it exchanges signs with that lord.'
    when: 'debilitated({planet}) and (any(x in without([dispositor({planet}), exaltation_lord({planet})],
      [{planet}]): in_kendra(x) or (x != moon and in_kendra(x, moon))) or any(x in exalted_in(sign({planet})):
      in_kendra(x) or (x != moon and in_kendra(x, moon))) or aspects(dispositor({planet}), {planet}) or
      exchange({planet}, dispositor({planet})))'
    participants: '[{planet}, dispositor({planet})]'
    effects:
      domains: [status, career]
      polarity: positive
      strength: major
      summary: 'The fall of {planet|title} is redeemed: after early setbacks in its matters the native
        rises, often to a position of authority.'
    notes: Texts list further cancellations (for example the planet exalted in the navamsa); only the
      conditions above are encoded.
    sources:
    - {text: phaladeepika, edition: sastri, chapter: 7, verified: false}
    - {text: raman_300, locator: Neechabhanga Raja Yoga, verified: false}
  instances:
  - params:
      planet: sun
    tests:
      positive:
      - {lagna: aries, sun: libra, moon: aries, rest: aries}
      negative:
      - {lagna: aries, sun: libra, moon: aries, rest: taurus}
  - params:
      planet: moon
    tests:
      positive:
      - {lagna: aries, moon: scorpio, rest: aries}
      negative:
      - {lagna: aries, moon: scorpio, rest: gemini}
  - params:
      planet: mars
    tests:
      positive:
      - {lagna: aries, mars: cancer, moon: aries, rest: aries}
      negative:
      - {lagna: aries, mars: cancer, moon: gemini, rest: taurus}
  - params:
      planet: mercury
    tests:
      positive:
      - {lagna: aries, mercury: pisces, moon: aries, rest: aries}
      negative:
      - {lagna: aries, mercury: pisces, moon: aries, rest: taurus}
  - params:
      planet: jupiter
    tests:
      positive:
      - {lagna: aries, jupiter: capricorn, moon: aries, rest: aries}
      negative:
      - {lagna: aries, jupiter: capricorn, moon: gemini, rest: taurus}
  - params:
      planet: venus
    tests:
      positive:
      - {lagna: aries, venus: virgo, moon: aries, rest: aries}
      negative:
      - {lagna: aries, venus: virgo, moon: aries, rest: gemini}
  - params:
      planet: saturn
    tests:
      positive:
      - {lagna: aries, saturn: aries, moon: aries, rest: aries}
