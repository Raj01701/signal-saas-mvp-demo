# Generated by scripts/generate_rule_families.py; edit the script and re-run it.
defaults:
  category: raja
  school: parashari
  provenance: classical
families:
- template:
    id: raja.lords_{a}_{b}
    name: Raja Yoga ({a|ord} and {b|ord} lords)
    description: The lords of the {a|ord} and {b|ord} houses, one ruling a kendra and the other a trikona,
      are associated by conjunction, mutual aspect or exchange.
    when: lord({a}) != lord({b}) and associated(lord({a}), lord({b}))
    participants: '[lord({a}), lord({b})]'
    notes: Association means conjunction, mutual graha drishti or sign exchange. A single planet owning
      both houses is not counted here (see raja.yogakaraka).
    sources:
    - {text: bphs, edition: santhanam, chapter: 39, verified: false}
    - {text: laghu_parashari, edition: raman, locator: Raja yogas of kendra and trikona lords, verified: false}
  instances:
  - params:
      a: 1
      b: 4
    overrides:
      effects:
        domains: [status, career]
        polarity: positive
        strength: major
        summary: 'The 1st and 4th lords join a kendra lord to a trikona lord: a Parashari Raja yoga promising
          authority, recognition and success, especially in the dashas of the two lords.'
    tests:
      positive:
      - {lagna: aries, mars: taurus, moon: taurus, rest: gemini}
      negative:
      - {lagna: aries, mars: aries, moon: taurus, rest: gemini}
