# Generated by scripts/generate_rule_families.py; edit the script and re-run it.
defaults:
  category: dhana
  school: parashari
  provenance: classical
families:
- template:
    id: dhana.lords_{a}_{b}
    name: Dhana Yoga ({a|ord} and {b|ord} lords)
    description: The lords of the {a|ord} and {b|ord} houses, both among the wealth houses (1, 2, 5, 9,
      11), are associated by conjunction, mutual aspect or exchange.
    when: lord({a}) != lord({b}) and associated(lord({a}), lord({b}))
    participants: '[lord({a}), lord({b})]'
    notes: Association means conjunction, mutual graha drishti or sign exchange. A single planet owning
      both houses is not counted here (see raja.yogakaraka).
    sources:
    - {text: bphs, edition: santhanam, chapter: 41, verified: false}
    - {text: pvr_integrated, locator: Dhana yogas, verified: false}
  instances:
  - params:
      a: 1
      b: 2
    overrides:
      effects:
        domains: &id001 [wealth]
        polarity: positive
        strength: moderate
        summary: 'The 1st and 2nd lords, both wealth-giving, combine: a Dhana yoga for earnings and accumulated
          wealth, active in the dashas of the two lords.'
    tests:
      positive:
      - {lagna: aries, mars: gemini, venus: gemini, rest: cancer}
      - {lagna: aries, mars: gemini, venus: sagittarius, rest: cancer}
      negative:
      - {lagna: aries, mars: aries, venus: taurus, rest: cancer}
  - params:
      a: 1
      b: 5
