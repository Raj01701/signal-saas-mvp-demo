        polarity: positive
        strength: moderate
        summary: 'The 1st and 5th lords, both wealth-giving, combine: a Dhana yoga for earnings and accumulated
          wealth, active in the dashas of the two lords.'
    tests:
      positive:
      - {lagna: aries, mars: taurus, sun: taurus, rest: gemini}
      negative:
      - {lagna: aries, mars: aries, sun: taurus, rest: gemini}
