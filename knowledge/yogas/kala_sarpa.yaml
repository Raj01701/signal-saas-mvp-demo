# Generated by scripts/generate_rule_families.py; edit the script and re-run it.
defaults:
  category: dosha
  school: parashari
  provenance: modern
rules:
- id: dosha.kala_sarpa
  name: Kala Sarpa Yoga
  description: All seven planets lie on one side of the Rahu-Ketu axis, hemmed in between the nodes.
  when: between_nodes(seven)
  participants: '[rahu, ketu]'
  effects: &id001
    domains: [fortune]
    polarity: negative
    strength: moderate
    summary: Modern practice associates this with obstacles, delays and sudden reversals, easing with
      age; it is not found in the classical texts.
  sources: &id002
  - {text: popular_practice, locator: Kala Sarpa Yoga as used in contemporary Indian practice, verified: false}
  notes: Positions are compared by longitude, so a planet in a node's sign counts as inside only if it
    lies on the same side of the axis as the others.
  tests:
    positive:
    - {lagna: aries, rahu: aries, rest: gemini}
    - {lagna: cancer, rahu: virgo, sun: taurus, moon: gemini, rest: cancer}
    negative:
    - {lagna: aries, rahu: aries, moon: sagittarius, rest: gemini}
families:
