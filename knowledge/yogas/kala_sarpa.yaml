    name: '{name|title} Kala Sarpa Yoga'
    description: Kala Sarpa Yoga with Rahu in the {house|ord} house; modern authors name the twelve types
      by Rahu's house.
    when: between_nodes(seven) and house(rahu) == {house}
    participants: '[rahu, ketu]'
    effects: *id001
    sources: *id002
    notes: Positions are compared by longitude, so a planet in a node's sign counts as inside only if
      it lies on the same side of the axis as the others.
