      b: 3
      kind: khala
    overrides:
      effects:
        domains: [character, health, self, siblings]
        polarity: mixed
        strength: minor
        summary: 'The 1st and 3rd lords exchange signs, and the 3rd lord is involved (Khala Parivartana):
          fluctuating fortune, bold or rash conduct, and good and bad phases in the 1st house (body, health
          and standing) and the 3rd house (siblings, courage and initiative).'
    tests:
