# Generated by scripts/generate_rule_families.py; edit the script and re-run it.
defaults:
  category: parivartana
  school: parashari
  provenance: classical
families:
- template:
    id: parivartana.{kind}_{a}_{b}
    name: '{kind|title} Parivartana Yoga ({a|ord} and {b|ord} lords)'
    description: The lords of the {a|ord} and {b|ord} houses occupy each other's signs (sign exchange).
      Phaladeepika names exchanges among the lords of houses 1, 2, 4, 5, 7, 9, 10 and 11 Maha yoga, those
      involving the 3rd lord Khala yoga, and those involving the lord of the 6th, 8th or 12th Dainya yoga.
    when: exchange(lord({a}), lord({b}))
    participants: '[lord({a}), lord({b})]'
    sources:
    - {text: phaladeepika, edition: sastri, chapter: 6, verified: false}
    - {text: raman_300, locator: Parivartana Yogas, verified: false}
  instances:
  - params:
      a: 1
      b: 2
      kind: maha
    overrides:
      effects:
        domains: [health, self, wealth]
        polarity: positive
        strength: major
        summary: 'The 1st and 2nd lords exchange signs (Maha Parivartana): the two houses support each
          other, bringing prosperity, rank and comforts through the 1st house (body, health and standing)
          and the 2nd house (wealth, family and speech).'
    tests:
      positive:
      - {lagna: aries, mars: taurus, venus: aries, rest: gemini}
      negative:
      - {lagna: aries, mars: taurus, venus: gemini, rest: gemini}
  - params:
