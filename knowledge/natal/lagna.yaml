      sign: aries
    overrides:
      effects:
        domains: [self, character]
        polarity: mixed
        strength: minor
        summary: Active, courageous and ambitious; quick to act and quick to anger.
    tests:
      positive:
      - {lagna: aries, rest: cancer}
      negative:
      - {lagna: taurus, rest: cancer}
  - params:
      sign: taurus
    overrides:
      effects:
        domains: [self, character]
        polarity: positive
        strength: minor
        summary: Patient and steady; fond of comfort and beauty; loyal but stubborn.
