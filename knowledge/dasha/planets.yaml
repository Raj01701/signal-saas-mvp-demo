# Generated by scripts/generate_readings.py; edit the script and re-run it.
defaults:
  category: dasha
  school: parashari
  provenance: classical
rules:
- id: dasha.yogakaraka
  name: Mahadasha of the yogakaraka
  description: The mahadasha lord owns both a kendra (4th, 7th or 10th) and a trikona (5th or 9th).
  when: yogakaraka(md)
  participants: '[md]'
  effects:
    domains: [status, career, fortune]
    polarity: positive
    strength: major
    summary: One of the most productive periods for status, career and fortune.
  sources:
  - &id001 {text: bphs, edition: santhanam, locator: Effects of the dashas, verified: false}
  - {text: laghu_parashari, edition: raman, locator: Yogakaraka, verified: false}
  tests:
    positive:
    - {lagna: taurus, rest: virgo, dasha: [saturn]}
    negative:
    - {lagna: aries, rest: virgo, dasha: [saturn]}
- id: dasha.maraka
  name: Mahadasha of a maraka lord
  description: The mahadasha lord owns the 2nd or 7th house (a maraka, killer, house).
  when: md in [lord(2), lord(7)]
  participants: '[md]'
  sensitive: true
  effects:
    domains: [longevity, health]
    polarity: negative
    strength: moderate
    summary: Texts associate maraka periods with health crises, above all late in life; judged only with
      longevity.
  sources:
  - {text: laghu_parashari, edition: raman, locator: Maraka lords, verified: false}
  - *id001
  tests:
    positive:
    - {lagna: aries, rest: virgo, dasha: [venus]}
    negative:
    - {lagna: aries, rest: virgo, dasha: [jupiter]}
- id: dasha.retrograde_lord
  name: Retrograde mahadasha lord
  description: The mahadasha lord (Mars to Saturn) was retrograde at birth.
  when: md in [mars, mercury, jupiter, venus, saturn] and retrograde(md)
  participants: '[md]'
  provenance: traditional
  effects:
    domains: [character]
    polarity: mixed
    strength: minor
    summary: Results come with delays, reversals or a return to unfinished matters.
  sources:
  - {text: popular_practice, locator: Dashas of retrograde planets, verified: false}
  tests:
    positive:
    - {lagna: aries, rest: virgo, dasha: [saturn], retrograde: [saturn]}
    negative:
    - {lagna: aries, rest: virgo, dasha: [saturn]}
families:
- template:
    id: dasha.{planet}_strong
    name: Mahadasha of a strong {planet|title}
    description: '{planet|title} runs the mahadasha and is strong (the working test of strong()).'
    when: md == {planet} and strong({planet})
    participants: '[{planet}]'
    sources:
    - &id002 {text: phaladeepika, edition: sastri, chapter: 19, verified: false}
    - *id001
  instances:
  - params:
      planet: sun
    overrides:
      effects:
        domains: [status, parents]
        polarity: positive
        strength: moderate
        summary: Honours, authority and gains through government or father; vigour and fame.
    tests:
      positive:
      - {lagna: aries, sun: aries, rest: leo, dasha: [sun]}
      negative:
      - {lagna: aries, sun: libra, rest: leo, dasha: [sun]}
  - params:
      planet: moon
    overrides:
      effects:
        domains: [character, parents]
        polarity: positive
        strength: moderate
        summary: Comforts, popularity and gains through the public; peace of mind.
    tests:
      positive:
      - {lagna: taurus, moon: taurus, rest: virgo, dasha: [moon]}
      negative:
      - {lagna: taurus, moon: scorpio, rest: virgo, dasha: [moon]}
  - params:
      planet: mars
    overrides:
      effects:
        domains: [conflict, property]
        polarity: positive
        strength: moderate
        summary: Gains through land, courage, command and competition; victory over rivals.
    tests:
      positive:
      - {lagna: capricorn, mars: capricorn, rest: taurus, dasha: [mars]}
      negative:
      - {lagna: capricorn, mars: cancer, rest: taurus, dasha: [mars]}
  - params:
      planet: mercury
    overrides:
      effects:
        domains: [intellect, education]
        polarity: positive
        strength: moderate
        summary: Learning, trade, writing and communication prosper; new friendships.
    tests:
      positive:
      - {lagna: virgo, mercury: virgo, rest: capricorn, dasha: [mercury]}
      negative:
      - {lagna: virgo, mercury: pisces, rest: capricorn, dasha: [mercury]}
  - params:
      planet: jupiter
    overrides:
      effects:
        domains: [fortune, children]
        polarity: positive
        strength: moderate
        summary: Wisdom, children, wealth, honour and religious merit increase.
    tests:
      positive:
      - {lagna: cancer, jupiter: cancer, rest: scorpio, dasha: [jupiter]}
      negative:
      - {lagna: cancer, jupiter: capricorn, rest: scorpio, dasha: [jupiter]}
  - params:
      planet: venus
    overrides:
      effects:
        domains: [marriage, wealth]
        polarity: positive
        strength: moderate
        summary: Marriage, comforts, vehicles, arts and luxuries; a pleasant period.
    tests:
      positive:
      - {lagna: pisces, venus: pisces, rest: cancer, dasha: [venus]}
      negative:
      - {lagna: pisces, venus: virgo, rest: cancer, dasha: [venus]}
  - params:
      planet: saturn
    overrides:
      effects:
        domains: [career]
        polarity: positive
        strength: moderate
        summary: A steady rise through discipline and service; property and followers.
    tests:
      positive:
      - {lagna: libra, saturn: libra, rest: aquarius, dasha: [saturn]}
      negative:
      - {lagna: libra, saturn: aries, rest: aquarius, dasha: [saturn]}
- template:
    id: dasha.{planet}_weak
    name: Mahadasha of a weak {planet|title}
    description: '{planet|title} runs the mahadasha and is debilitated, combust, or in a dusthana outside
      its own dignity.'
    when: md == {planet} and (debilitated({planet}) or combust({planet}) or (in_dusthana({planet}) and
      not dignified({planet})))
    participants: '[{planet}]'
    sources:
    - *id002
    - *id001
  instances:
  - params:
      planet: sun
    overrides:
      effects:
        domains: [status, parents]
        polarity: negative
        strength: moderate
        summary: Friction with authority or father, low vitality and loss of position.
    tests:
      positive:
      - {lagna: aries, sun: libra, rest: leo, dasha: [sun]}
      negative:
      - {lagna: aries, sun: aries, rest: leo, dasha: [sun]}
  - params:
      planet: moon
    overrides:
      effects:
        domains: [character, parents]
        polarity: negative
        strength: moderate
        summary: Emotional unrest, changes of residence and strain concerning mother.
    tests:
      positive:
      - {lagna: taurus, moon: scorpio, rest: virgo, dasha: [moon]}
      negative:
      - {lagna: taurus, moon: taurus, rest: virgo, dasha: [moon]}
  - params:
      planet: mars
    overrides:
      effects:
        domains: [conflict, property]
        polarity: negative
        strength: moderate
        summary: Quarrels, accidents, property disputes and friction with siblings.
    tests:
      positive:
      - {lagna: capricorn, mars: cancer, rest: taurus, dasha: [mars]}
      negative:
      - {lagna: capricorn, mars: capricorn, rest: taurus, dasha: [mars]}
  - params:
      planet: mercury
    overrides:
      effects:
        domains: [intellect, education]
        polarity: negative
        strength: moderate
        summary: Nervous strain, mistakes in trade or documents, and disputes.
    tests:
      positive:
      - {lagna: virgo, mercury: pisces, rest: capricorn, dasha: [mercury]}
      negative:
      - {lagna: virgo, mercury: virgo, rest: capricorn, dasha: [mercury]}
  - params:
      planet: jupiter
    overrides:
      effects:
        domains: [fortune, children]
        polarity: negative
        strength: moderate
        summary: Loss of respect or wealth; trouble concerning children or teachers.
    tests:
      positive:
      - {lagna: cancer, jupiter: capricorn, rest: scorpio, dasha: [jupiter]}
      negative:
      - {lagna: cancer, jupiter: cancer, rest: scorpio, dasha: [jupiter]}
  - params:
      planet: venus
    overrides:
      effects:
        domains: [marriage, wealth]
        polarity: negative
        strength: moderate
        summary: Disappointments in relationships and overspending on pleasures.
    tests:
      positive:
      - {lagna: pisces, venus: virgo, rest: cancer, dasha: [venus]}
      negative:
      - {lagna: pisces, venus: pisces, rest: cancer, dasha: [venus]}
  - params:
      planet: saturn
    overrides:
      effects:
        domains: [career]
        polarity: negative
        strength: moderate
        summary: Hardship, delays, fatigue and losses; heavy burdens of work.
    tests:
      positive:
      - {lagna: libra, saturn: aries, rest: aquarius, dasha: [saturn]}
      negative:
      - {lagna: libra, saturn: libra, rest: aquarius, dasha: [saturn]}
- template:
    id: dasha.{node}_{group}
    name: Mahadasha of {node|title} in {where}
    description: '{node|title} runs the mahadasha from {where} house; the nodes also give the results
      of their dispositors.'
    when: md == {node} and house({node}) in {houses}
    participants: '[{node}, dispositor({node})]'
    sources:
    - *id001
  instances:
  - params:
      node: rahu
      group: kendra_trikona
      where: a kendra or trikona
      houses: '[1, 4, 5, 7, 9, 10]'
    overrides:
      effects:
        domains: [travel, career]
        polarity: positive
        strength: moderate
        summary: Ambition, sudden rises and gains through foreign or unusual channels.
    tests:
      positive:
      - {lagna: aries, rahu: cancer, rest: taurus, dasha: [rahu]}
      negative:
      - {lagna: aries, rahu: scorpio, rest: taurus, dasha: [rahu]}
  - params:
      node: rahu
      group: upachaya
      where: an upachaya (3rd, 6th, 10th or 11th)
      houses: upachayas
    overrides:
      effects:
        domains: [travel, career]
        polarity: positive
        strength: moderate
        summary: Success over rivals, courage and material gains.
    tests:
      positive:
      - {lagna: aries, rahu: gemini, rest: taurus, dasha: [rahu]}
      negative:
      - {lagna: aries, rahu: taurus, rest: taurus, dasha: [rahu]}
  - params:
      node: rahu
      group: dusthana
      where: the 8th or 12th
      houses: '[8, 12]'
    overrides:
      effects:
        domains: [travel, career]
        polarity: negative
        strength: moderate
        summary: Confusion, losses, anxiety and trouble through foreign dealings.
    tests:
      positive:
      - {lagna: aries, rahu: scorpio, rest: taurus, dasha: [rahu]}
      negative:
      - {lagna: aries, rahu: sagittarius, rest: taurus, dasha: [rahu]}
  - params:
      node: ketu
      group: upachaya
      where: an upachaya (3rd, 6th, 10th or 11th)
      houses: upachayas
    overrides:
      effects:
        domains: [spirituality]
        polarity: positive
        strength: moderate
        summary: Courage, success over rivals and spiritual progress.
    tests:
      positive:
      - {lagna: aries, ketu: virgo, rest: taurus, dasha: [ketu]}
      negative:
      - {lagna: aries, ketu: leo, rest: taurus, dasha: [ketu]}
  - params:
      node: ketu
      group: dusthana
      where: the 8th or 12th
      houses: '[8, 12]'
    overrides:
      effects:
        domains: [spirituality]
        polarity: mixed
        strength: moderate
        summary: Detachment and spiritual progress, with losses and isolation.
    tests:
      positive:
      - {lagna: aries, ketu: pisces, rest: taurus, dasha: [ketu]}
      negative:
      - {lagna: aries, ketu: aquarius, rest: taurus, dasha: [ketu]}
