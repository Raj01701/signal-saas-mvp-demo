# Generated by scripts/generate_readings.py; edit the script and re-run it.
defaults:
  category: dasha
  school: parashari
  provenance: classical
families:
- template:
    id: dasha.md_lord_of_{house}
    name: Mahadasha of the {house|ord} lord
    description: The mahadasha lord owns the {house|ord} house.
    when: md == lord({house})
    participants: '[md]'
    sources: &id001
    - {text: bphs, edition: santhanam, locator: Effects of the dashas, verified: false}
    - {text: phaladeepika, edition: sastri, chapter: 19, verified: false}
  instances:
  - params:
      house: 1
    overrides:
      effects:
        domains: [self, health]
        polarity: positive
        strength: moderate
        summary: Health, confidence and personal initiative come to the fore; new beginnings.
    tests:
      positive:
      - {lagna: taurus, rest: virgo, dasha: [venus]}
      negative:
      - {lagna: taurus, rest: virgo, dasha: [sun]}
  - params:
      house: 2
    overrides:
      effects:
        domains: [wealth]
        polarity: mixed
        strength: moderate
        summary: Wealth, family affairs and speech come to the fore; savings grow if the lord is strong.
    tests:
      positive:
      - {lagna: gemini, rest: virgo, dasha: [moon]}
      negative:
      - {lagna: gemini, rest: virgo, dasha: [sun]}
  - params:
      house: 3
    overrides:
      effects:
        domains: [siblings, character]
        polarity: mixed
        strength: moderate
        summary: Initiative, siblings, short journeys and communication; results follow effort.
    tests:
      positive:
      - {lagna: cancer, rest: virgo, dasha: [mercury]}
      negative:
      - {lagna: cancer, rest: virgo, dasha: [sun]}
  - params:
      house: 4
    overrides:
      effects:
        domains: [property, parents]
        polarity: positive
        strength: moderate
        summary: Home, property, vehicles, mother and education come to the fore.
    tests:
      positive:
      - {lagna: leo, rest: virgo, dasha: [mars]}
      negative:
      - {lagna: leo, rest: virgo, dasha: [sun]}
  - params:
      house: 5
    overrides:
      effects:
        domains: [children, intellect]
        polarity: positive
        strength: moderate
        summary: Children, learning, creativity and merit come to the fore; good for study.
    tests:
      positive:
      - {lagna: virgo, rest: virgo, dasha: [saturn]}
      negative:
      - {lagna: virgo, rest: virgo, dasha: [sun]}
  - params:
      house: 6
    overrides:
      effects:
        domains: [conflict, health]
        polarity: negative
        strength: moderate
        summary: Competition, debts, disputes and health matters; service and hard work succeed.
    tests:
      positive:
      - {lagna: libra, rest: virgo, dasha: [jupiter]}
      negative:
      - {lagna: libra, rest: virgo, dasha: [sun]}
  - params:
      house: 7
    overrides:
      effects:
        domains: [marriage]
        polarity: mixed
        strength: moderate
        summary: Marriage, partnerships, business and travel come to the fore.
    tests:
      positive:
      - {lagna: scorpio, rest: virgo, dasha: [venus]}
      negative:
      - {lagna: scorpio, rest: virgo, dasha: [sun]}
  - params:
      house: 8
    overrides:
      effects:
        domains: [health, spirituality]
        polarity: negative
        strength: moderate
        summary: Obstacles, sudden changes, research and inheritance come to the fore.
    tests:
      positive:
      - {lagna: sagittarius, rest: virgo, dasha: [moon]}
      negative:
      - {lagna: sagittarius, rest: virgo, dasha: [sun]}
  - params:
      house: 9
    overrides:
      effects:
        domains: [fortune, parents]
        polarity: positive
        strength: moderate
        summary: Fortune, dharma, teachers, father and long journeys; a favourable period.
    tests:
      positive:
      - {lagna: capricorn, rest: virgo, dasha: [mercury]}
      negative:
      - {lagna: capricorn, rest: virgo, dasha: [sun]}
  - params:
      house: 10
    overrides:
      effects:
        domains: [career, status]
        polarity: positive
        strength: moderate
        summary: Career, status and public deeds come to the fore; advancement if the lord is strong.
    tests:
      positive:
      - {lagna: aquarius, rest: virgo, dasha: [mars]}
      negative:
      - {lagna: aquarius, rest: virgo, dasha: [sun]}
  - params:
      house: 11
    overrides:
      effects:
        domains: [wealth]
        polarity: positive
        strength: moderate
        summary: Gains, income, friends and fulfilled desires come to the fore.
    tests:
      positive:
      - {lagna: pisces, rest: virgo, dasha: [saturn]}
      negative:
      - {lagna: pisces, rest: virgo, dasha: [sun]}
  - params:
      house: 12
    overrides:
      effects:
        domains: [wealth, spirituality, travel]
        polarity: negative
        strength: moderate
        summary: Expenses, travel abroad, retreat and spiritual pursuits; losses need watching.
    tests:
      positive:
      - {lagna: aries, rest: virgo, dasha: [jupiter]}
