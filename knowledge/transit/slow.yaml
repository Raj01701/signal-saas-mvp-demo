rules:
- id: transit.sade_sati
  name: Sade Sati
  description: Saturn transits the 12th, 1st or 2nd house from the natal Moon (about seven and a half
    years).
  when: transit_house(saturn, moon) in [12, 1, 2]
  participants: '[saturn, moon]'
  effects:
    domains: [career, wealth, health]
    polarity: negative
    strength: major
    summary: Pressure, responsibility and restructuring; effort matures slowly.
  sources:
  - {text: popular_practice, locator: Sade Sati, verified: false}
  tests:
    positive:
    - {lagna: aries, moon: cancer, rest: libra, transit: {saturn: gemini}}
    negative:
    - {lagna: aries, moon: cancer, rest: libra, transit: {saturn: virgo}}
  provenance: traditional
- id: transit.kantaka_shani
  name: Kantaka Shani
  description: Saturn transits the 4th, 7th or 10th house from the natal Moon.
  when: transit_house(saturn, moon) in [4, 7, 10]
  participants: '[saturn, moon]'
  effects:
    domains: [career, property, marriage]
    polarity: negative
    strength: moderate
    summary: Obstacles in work, home or relationships; patience is needed.
  sources:
  - {text: popular_practice, locator: Kantaka Shani, verified: false}
  tests:
    positive:
    - {lagna: aries, moon: cancer, rest: libra, transit: {saturn: libra}}
    negative:
    - {lagna: aries, moon: cancer, rest: libra, transit: {saturn: scorpio}}
  provenance: traditional
